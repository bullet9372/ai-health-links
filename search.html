            { name: "시니어 전용 경추 베개", desc: "뇌가 편안한 숙면을 돕는 기능성 베개", link: "https://link.coupang.com/a/d4oAqg" },

            { name: "프리미엄 밀크씨슬", desc: "간 건강을 위한 정성 어린 영양제", link: "https://link.coupang.com/a/d4oupO" },
            { name: "아침용 견과류 세트", desc: "혈당 스파이크 없는 든든한 아침", link: "https://link.coupang.com/a/d4iXzK" },
            { name: "허리 디스크 보호 베개", desc: "허리 건강을 지켜주는 기능성 설계", link: "https://link.coupang.com/a/d4i3pj" },
            { name: "바나바잎 추출물 (코로솔산)", desc: "식후 혈당 상승 억제에 도움", link: "https://link.coupang.com/a/d6YURY" },

            { name: "무설탕 국산 두유", desc: "첨가물 없는 순수한 콩 영양", link: "https://link.coupang.com/a/d6YWVK" },
            { name: "스테비아 토마토/견과류", desc: "달콤하지만 혈당 걱정 없는 간식", link: "https://link.coupang.com/a/d6YXzf" },
            { name: "연속/자가 혈당 측정기", desc: "집에서 실시간으로 체크하는 혈당", link: "https://link.coupang.com/a/d6YYP2" },
            { name: "혈행 개선제", desc: "막힘 없는 혈관 흐름을 위한 관리", link: "https://link.coupang.com/a/d6Y01N" },
            { name: "뇌 에너지 보조: MCT 오일 (C8)", desc: "포도당 대신 뇌 에너지를 공급해 인슐린 저항성 보완", link: "https://link.coupang.com/a/d7AQAQ" },
            { name: "뇌 염증 관리: 고함량 커큐민", desc: "뇌에 쌓이는 독소와 염증 제거에 도움", link: "https://link.coupang.com/a/d7AV45" },          
            { name: "뇌를 깨우는 수분: 미네랄 생수", desc: "밤새 끈적해진 혈액을 맑게 하는 깨끗한 물 한 잔", link: "https://link.coupang.com/a/d7DwmH" },          
            { name: "혈당 안심 단백질: 구운 달걀 세트", desc: "바쁜 아침, 혈당 스파이크 걱정 없는 최고의 영양식", link: "https://link.coupang.com/a/d7DxRn" },          
            { name: "공기 질 관리: 공기청정기", desc: "밀폐된 방 안에서도 뇌가 숨 쉴 수 있게 도와줍니다", link: "https://link.coupang.com/a/d8P6nx" },          
            { name: "빛 완전 차단: 실크 암막 안대", desc: "미세한 불빛까지 차단해 멜라토닌 분비를 극대화합니다", link: "https://link.coupang.com/a/d8QbXg" },          
            { name: "은나노 항균 칫솔 세트", desc: "세균 번식을 억제하고 잇몸 자극을 최소화하는 5070 추천 칫솔", link: "https://link.coupang.com/a/d9oV5l" },
            { name: "40수 고중량 순면 수건", desc: "흡수력이 뛰어나고 세탁 후에도 부드러운 안심 수건", link: "https://link.coupang.com/a/d9oVaD" }
        ];

        const listContainer = document.getElementById('productList');
        const searchInput = document.getElementById('searchInput');

        // 제품 목록 출력 함수
        function renderProducts(data) {
            if (data.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl border border-slate-200">
                        <p class="text-slate-400 font-bold">검색 결과가 없습니다.</p>
                        <p class="text-xs text-slate-300 mt-1">다른 검색어로 다시 시도해 보세요.</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = data.map(p => `
                <a href="${p.link}" target="_blank" rel="noopener noreferrer" class="block bg-white p-5 rounded-2xl border border-slate-200 shadow-sm product-card">
                    <h4 class="font-bold text-lg text-slate-900">🎁 ${p.name}</h4>
                    <p class="text-sm text-slate-500 mt-1">${p.desc}</p>
                </a>
            `).join('');
        }

        // 검색 처리 함수
        function handleSearch() {
            const query = searchInput.value.trim().toLowerCase();
            
            if (query.length === 0) {
                renderProducts(allProducts);
                return;
            }

            if (query.length < 2) {
                alert("최소 두 글자는 입력해 주세요!");
                return;
            }

            const filtered = allProducts.filter(p => 
                p.name.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query)
            );
            
            renderProducts(filtered);
        }

        // 이벤트 리스너 등록
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts(allProducts);

            // 엔터키 검색 지원
            searchInput.addEventListener('keypress', (e) => { 
                if (e.key === 'Enter') handleSearch(); 
            });

            // 입력창을 비웠을 때 전체 목록 자동 복원
            searchInput.addEventListener('input', (e) => {
                if (e.target.value.trim() === '') {
                    renderProducts(allProducts);
                }
            });
        });
    </script>
</body>
</html>
